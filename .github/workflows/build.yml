name: Build OpenWrt for TL-WR710N v1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download ImageBuilder
        run: |
          wget -q https://downloads.openwrt.org/releases/22.03.7/targets/ath79/generic/openwrt-imagebuilder-22.03.7-ath79-generic.Linux-x86_64.tar.xz
          tar xf openwrt-imagebuilder-22.03.7-ath79-generic.Linux-x86_64.tar.xz

      - name: Build firmware
        run: |
          cd openwrt-imagebuilder-22.03.7-ath79-generic.Linux-x86_64
          make image PROFILE="tplink_tl-wr710n-v1" \
            PACKAGES="shadowsocks-libev-ss-redir shadowsocks-libev-ss-tunnel iptables-mod-tproxy ip-full ipset \
            -luci -luci-base -luci-lib-ip -luci-lib-jsonc -luci-lib-nixio -uhttpd \
            -ppp -ppp-mod-pppoe -kmod-pppoe -kmod-pppox -odhcp6c -kmod-ipv6 -ip6tables"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-wr710n-v1-ss
          path: openwrt-imagebuilder-*/bin/targets/ath79/generic/*sysupgrade*
