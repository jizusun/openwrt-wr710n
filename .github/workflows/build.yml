name: Build OpenWrt for TL-WR710N v1

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: full-luci
            desc: "完整 LuCI + shadowsocks + IPv6"
            packages: >-
              shadowsocks-libev-ss-redir
              ip-full
              -ppp -ppp-mod-pppoe -kmod-pppoe -kmod-pppox
          - name: mini-luci
            desc: "最小 LuCI + shadowsocks + IPv6"
            packages: >-
              shadowsocks-libev-ss-redir
              ip-full
              luci-base luci-mod-admin-full luci-mod-network luci-mod-status luci-mod-system luci-theme-bootstrap uhttpd
              -luci-app-firewall -luci-app-opkg -luci-proto-ipv6 -luci-proto-ppp -luci-ssl
              -ppp -ppp-mod-pppoe -kmod-pppoe -kmod-pppox
          - name: no-luci
            desc: "shadowsocks + IPv6, no LuCI"
            packages: >-
              shadowsocks-libev-ss-redir
              ip-full
              -luci -luci-base -luci-lib-ip -luci-lib-jsonc -luci-lib-nixio -uhttpd
              -ppp -ppp-mod-pppoe -kmod-pppoe -kmod-pppox

    name: "${{ matrix.name }} - ${{ matrix.desc }}"
    steps:
      - uses: actions/checkout@v4

      - name: Download ImageBuilder
        run: |
          wget -q https://downloads.openwrt.org/releases/22.03.7/targets/ath79/generic/openwrt-imagebuilder-22.03.7-ath79-generic.Linux-x86_64.tar.xz
          tar xf openwrt-imagebuilder-22.03.7-ath79-generic.Linux-x86_64.tar.xz

      - name: Download chnroute
        run: |
          curl -sL https://raw.githubusercontent.com/17mon/china_ip_list/master/china_ip_list.txt \
            -o files/etc/shadowsocks-libev/chnroute.txt
          wc -l files/etc/shadowsocks-libev/chnroute.txt

      - name: Build firmware
        run: |
          cd openwrt-imagebuilder-22.03.7-ath79-generic.Linux-x86_64
          make image PROFILE="tplink_tl-wr710n-v1" \
            PACKAGES="${{ matrix.packages }}" \
            FILES="../files"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-wr710n-v1-${{ matrix.name }}
          path: openwrt-imagebuilder-*/bin/targets/ath79/generic/*sysupgrade*
