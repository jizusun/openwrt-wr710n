name: Build OpenWrt for TL-WR710N v1

on:
  push:
    branches: [main]

env:
  OPENWRT_VERSION: "19.07.10"
  IMAGEBUILDER_URL: "https://downloads.openwrt.org/releases/19.07.10/targets/ath79/generic/openwrt-imagebuilder-19.07.10-ath79-generic.Linux-x86_64.tar.xz"
  PROFILE: "tplink_tl-wr710n-v1"

jobs:
  build:
    runs-on: ubuntu-20.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: full
            desc: "iptables + shadowsocks + IPv6"
            packages: >-
              shadowsocks-libev-ss-redir shadowsocks-libev-ss-tunnel
              iptables-mod-nat-extra ip-full ipset
              -ppp -ppp-mod-pppoe -kmod-pppoe -kmod-pppox

    name: "${{ matrix.name }} - ${{ matrix.desc }}"
    steps:
      - uses: actions/checkout@v4

      - name: Download ImageBuilder
        run: |
          wget -q ${{ env.IMAGEBUILDER_URL }}
          tar xf openwrt-imagebuilder-*.tar.xz
          mv openwrt-imagebuilder-*-ath79-generic.Linux-x86_64 imagebuilder

      - name: Download chnroute
        run: |
          curl -sL https://raw.githubusercontent.com/17mon/china_ip_list/master/china_ip_list.txt \
            -o files/etc/shadowsocks-libev/chnroute.txt
          wc -l files/etc/shadowsocks-libev/chnroute.txt

      - name: Build firmware
        run: |
          cd imagebuilder
          make image PROFILE="${{ env.PROFILE }}" \
            PACKAGES="${{ matrix.packages }}" \
            FILES="../files"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-wr710n-v1-${{ matrix.name }}
          path: imagebuilder/bin/targets/ath79/generic/*sysupgrade*
